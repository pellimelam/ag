
name: Build Argentina JSON

on:
  workflow_dispatch:
  push:
    paths:
      - "local.xlsx"
      - "scripts/build_argentina.py"
      - ".github/workflows/build-argentina-json.yml"

permissions:
  contents: write

concurrency:
  group: argentina-json-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas openpyxl

      - name: Verify source Excel
        run: |
          test -f local.xlsx || {
            echo "ERROR: local.xlsx not found in repository root."
            exit 1
          }

      - name: Convert Excel to minified JSON
        run: python scripts/build_argentina.py

      - name: Validate JSON
        run: |
          python -c "import json,pathlib; p=pathlib.Path('argentina.json'); d=json.loads(p.read_text(encoding='utf-8')); assert isinstance(d,list) and len(d)>0; assert all(isinstance(x,dict) for x in d); print('Records:',len(d)); print('File size:',p.stat().st_size,'bytes')"

      - name: Commit JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add argentina.json

          if git diff --cached --quiet; then
            echo "No changes to argentina.json."
          else
            git commit -m "Build minified Argentina JSON"
            git push
          fi
