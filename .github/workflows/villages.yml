
name: Generate Argentina Locality Pages

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - argentina.json
      - apps.json
      - template.html
      - manifest.json
      - sw.js
      - app.js
      - main.css
      - icons/**
      - .github/workflows/villages.yml

permissions:
  contents: write

concurrency:
  group: generate-argentina-localities
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Argentina Dataset and Source Files
        shell: node {0}
        run: |
          const fs = require("fs");

          const requiredFiles = [
            "argentina.json",
            "apps.json",
            "template.html",
            "manifest.json",
            "sw.js",
            "app.js",
            "main.css"
          ];

          for (const file of requiredFiles) {
            if (!fs.existsSync(file)) {
              throw new Error(`Required file is missing: ${file}`);
            }
          }

          const localities = JSON.parse(
            fs.readFileSync("argentina.json", "utf8")
          );

          const apps = JSON.parse(
            fs.readFileSync("apps.json", "utf8")
          );

          if (!Array.isArray(localities) || localities.length === 0) {
            throw new Error(
              "argentina.json must contain a non-empty array."
            );
          }

          if (!Array.isArray(apps)) {
            throw new Error("apps.json must contain a JSON array.");
          }

          const requiredFields = [
            "locality",
            "province",
            "localityCode"
          ];

          for (let i = 0; i < localities.length; i++) {
            const record = localities[i];

            for (const field of requiredFields) {
              if (
                record[field] === undefined ||
                record[field] === null ||
                String(record[field]).trim() === ""
              ) {
                throw new Error(
                  `Record ${i + 1} is missing "${field}".`
                );
              }
            }
          }

          console.log(`Validated ${localities.length} Argentina records.`);
          console.log(`Validated ${apps.length} app/service records.`);

      - name: Generate Argentina Locality Pages
        shell: node {0}
        run: |
          const fs = require("fs");
          const path = require("path");

          const root = process.cwd();

          const localities = JSON.parse(
            fs.readFileSync("argentina.json", "utf8")
          );

          // Read the source dataset once and copy it into every locality.
          const appsJson = fs.readFileSync("apps.json", "utf8");
          JSON.parse(appsJson);

          const template = fs.readFileSync("template.html", "utf8");
          const manifestTemplate = fs.readFileSync("manifest.json", "utf8");
          const swTemplate = fs.readFileSync("sw.js", "utf8");

          function clean(value) {
            if (value === null || value === undefined) {
              return "";
            }

            return String(value).trim();
          }

          function slugify(value) {
            return clean(value)
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-+|-+$/g, "");
          }

          function escapeHtml(value) {
            return clean(value)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#39;");
          }

          function replaceTokens(content, tokens) {
            let output = content;

            for (const [key, value] of Object.entries(tokens)) {
              output = output.replaceAll(
                `{{${key}}}`,
                String(value)
              );
            }

            return output;
          }

          function getLocality(record, index) {
            const locality = clean(record.locality);
            const province = clean(record.province);
            const department = clean(record.department);
            const localityCode = clean(record.localityCode);

            if (!locality || !province || !localityCode) {
              throw new Error(
                `Invalid locality record at position ${index + 1}.`
              );
            }

            const localitySlug = slugify(locality);
            const codeSlug = slugify(localityCode);

            if (!localitySlug || !codeSlug) {
              throw new Error(
                `Cannot create a folder for record ${index + 1}.`
              );
            }

            return {
              locality,
              province,
              department,
              localityCode,
              localitySlug,
              folder: `${localitySlug}-${codeSlug}`,
              localityType:
                clean(record.localityType) || "No especificado",
              agglomeration:
                clean(record.agglomeration) || "No especificada",
              localGovernment:
                clean(record.localGovernment) || "No especificado",
              localGovernmentCategory:
                clean(record.localGovernmentCategory) || "No especificada",
              jurisdictionCode: clean(record.jurisdictionCode),
              departmentCode: clean(record.departmentCode),
              agglomerationCode: clean(record.agglomerationCode),
              localGovernmentCode: clean(record.localGovernmentCode)
            };
          }

          function makeTokens(item) {
            const canonical =
              `https://argentina.vidhwaan.com/${item.folder}/`;

            return {
              LOCALITY_NAME: escapeHtml(item.locality),
              LOCALITY_SLUG: item.localitySlug,
              LOCALITY_CODE: escapeHtml(item.localityCode),
              PROVINCE_NAME: escapeHtml(item.province),
              DEPARTMENT_NAME:
                escapeHtml(item.department || "No especificado"),
              LOCALITY_TYPE: escapeHtml(item.localityType),
              AGGLOMERATION_NAME: escapeHtml(item.agglomeration),
              LOCAL_GOVERNMENT_NAME:
                escapeHtml(item.localGovernment),
              LOCAL_GOVERNMENT_CATEGORY:
                escapeHtml(item.localGovernmentCategory),
              LOCALITY_FOLDER: item.folder,
              LOCALITY_CANONICAL_URL: canonical,

              // Legacy template tokens.
              VILLAGE_NAME: escapeHtml(item.locality),
              VILLAGE_NAME_UPPER:
                escapeHtml(item.locality.toUpperCase()),
              PINCODE: escapeHtml(item.localityCode),
              VILLAGE_FOLDER: item.folder
            };
          }

          // Prepare every folder name before generating any files.
          const items = localities.map(getLocality);
          const currentFolders = new Set();

          for (const item of items) {
            if (currentFolders.has(item.folder)) {
              throw new Error(
                `Duplicate locality folder: ${item.folder}`
              );
            }

            currentFolders.add(item.folder);
          }

          // Remove obsolete generated locality folders only.
          // Never delete unrelated project directories.
          let removed = 0;

          for (const name of fs.readdirSync(root)) {
            const fullPath = path.join(root, name);

            if (currentFolders.has(name)) continue;

            let stat;

            try {
              stat = fs.lstatSync(fullPath);
            } catch {
              continue;
            }

            if (!stat.isDirectory()) continue;

            const indexPath = path.join(fullPath, "index.html");
            const manifestPath = path.join(fullPath, "manifest.json");
            const swPath = path.join(fullPath, "sw.js");

            if (
              !fs.existsSync(indexPath) ||
              !fs.existsSync(manifestPath) ||
              !fs.existsSync(swPath)
            ) {
              continue;
            }

            const oldHtml = fs.readFileSync(indexPath, "utf8");

            const isGeneratedLocality =
              oldHtml.includes("https://argentina.vidhwaan.com/") ||
              oldHtml.includes("{{LOCALITY_NAME}}");

            if (isGeneratedLocality) {
              fs.rmSync(fullPath, {
                recursive: true,
                force: true
              });

              removed++;
            }
          }

          console.log(`Removed ${removed} obsolete locality folders.`);

          let generated = 0;

          for (const item of items) {
            const directory = path.join(root, item.folder);
            const tokens = makeTokens(item);

            fs.mkdirSync(directory, { recursive: true });

            const outputs = {
              "index.html": replaceTokens(template, tokens),
              "manifest.json": replaceTokens(manifestTemplate, tokens),
              "sw.js": replaceTokens(swTemplate, tokens)
            };

            for (const [fileName, content] of Object.entries(outputs)) {
              if (content.includes("{{")) {
                throw new Error(
                  `Unreplaced template token in ${item.folder}/${fileName}`
                );
              }

              fs.writeFileSync(
                path.join(directory, fileName),
                content,
                "utf8"
              );
            }

            // CRITICAL: Copy apps.json into every locality folder.
            fs.writeFileSync(
              path.join(directory, "apps.json"),
              appsJson,
              "utf8"
            );

            generated++;

            if (generated % 500 === 0) {
              console.log(
                `Generated ${generated} of ${items.length} locality folders...`
              );
            }
          }

          console.log(
            `Successfully generated ${generated} Argentina locality pages.`
          );

      - name: Verify Every Locality Folder
        shell: node {0}
        run: |
          const fs = require("fs");
          const path = require("path");

          const localities = JSON.parse(
            fs.readFileSync("argentina.json", "utf8")
          );

          const sourceApps = fs.readFileSync("apps.json", "utf8");

          function slugify(value) {
            return String(value)
              .trim()
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-+|-+$/g, "");
          }

          const requiredFiles = [
            "index.html",
            "manifest.json",
            "sw.js",
            "apps.json"
          ];

          let verified = 0;

          for (let i = 0; i < localities.length; i++) {
            const record = localities[i];

            const folder =
              `${slugify(record.locality)}-${slugify(record.localityCode)}`;

            const directory = path.join(process.cwd(), folder);

            for (const fileName of requiredFiles) {
              const fullPath = path.join(directory, fileName);

              if (!fs.existsSync(fullPath)) {
                throw new Error(`Missing generated file: ${fullPath}`);
              }
            }

            const html = fs.readFileSync(
              path.join(directory, "index.html"),
              "utf8"
            );

            if (html.includes("{{")) {
              throw new Error(
                `Unreplaced template token in ${folder}/index.html`
              );
            }

            const copiedApps = fs.readFileSync(
              path.join(directory, "apps.json"),
              "utf8"
            );

            // Confirm the locality has the same dataset as the root file.
            if (copiedApps !== sourceApps) {
              throw new Error(
                `apps.json does not match the root dataset in ${folder}.`
              );
            }

            const parsedApps = JSON.parse(copiedApps);

            if (!Array.isArray(parsedApps)) {
              throw new Error(
                `Invalid apps.json array in ${folder}.`
              );
            }

            JSON.parse(
              fs.readFileSync(
                path.join(directory, "manifest.json"),
                "utf8"
              )
            );

            verified++;
          }

          console.log(
            `SUCCESS: Verified all ${verified} locality folders.`
          );
          console.log(
            "Every locality contains index.html, manifest.json, sw.js and apps.json."
          );

      - name: Commit Generated Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate Argentina locality pages and apps data"
            git push
          fi
