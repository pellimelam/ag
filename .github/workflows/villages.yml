name: Generate Argentina Locality Pages
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - argentina.json
      - apps.json
      - template.html
      - manifest.json
      - sw.js
      - app.js
      - main.css
      - icons/**
      - .github/workflows/villages.yml

permissions:
  contents: write

concurrency:
  group: generate-argentina-localities
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Source Files and Argentina Dataset
        shell: node {0}
        run: |
          const fs = require("fs");
          const required = ["argentina.json","apps.json","template.html","sw.js","app.js","main.css"];
          for (const file of required) {
            if (!fs.existsSync(file)) throw new Error(`Missing required file: ${file}`);
          }
          const localities = JSON.parse(fs.readFileSync("argentina.json","utf8"));
          const apps = JSON.parse(fs.readFileSync("apps.json","utf8"));
          if (!Array.isArray(localities) || !localities.length) throw new Error("argentina.json must contain a non-empty array.");
          if (!Array.isArray(apps)) throw new Error("apps.json must contain an array.");
          for (let i = 0; i < localities.length; i++) {
            const r = localities[i];
            for (const f of ["locality","province","localityCode"]) {
              if (r[f] == null || !String(r[f]).trim()) throw new Error(`Record ${i+1} is missing ${f}.`);
            }
          }
          console.log(`Validated ${localities.length} localities and ${apps.length} app/service records.`);

      - name: Generate Locality Pages and Root Manifest
        shell: node {0}
        run: |
          const fs = require("fs");
          const path = require("path");
          const root = process.cwd();
          const localities = JSON.parse(fs.readFileSync("argentina.json","utf8"));
          const appsJson = fs.readFileSync("apps.json","utf8");
          const template = fs.readFileSync("template.html","utf8");
          const swTemplate = fs.readFileSync("sw.js","utf8");
          JSON.parse(appsJson);

          function clean(v) {
            return v == null ? "" : String(v).trim();
          }

          function slugify(v) {
            return clean(v).normalize("NFD")
              .replace(/[\u0300-\u036f]/g,"")
              .toLowerCase()
              .replace(/[^a-z0-9]+/g,"-")
              .replace(/^-+|-+$/g,"");
          }

          function escapeHtml(v) {
            return clean(v).replace(/&/g,"&amp;")
              .replace(/</g,"&lt;").replace(/>/g,"&gt;")
              .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
          }

          function replaceTokens(content,tokens) {
            let out = content;
            for (const [key,value] of Object.entries(tokens)) {
              out = out.replaceAll(`{{${key}}}`,String(value));
            }
            return out;
          }

          function getItem(r,i) {
            const locality = clean(r.locality);
            const province = clean(r.province);
            const department = clean(r.department);
            const localityCode = clean(r.localityCode);
            const localitySlug = slugify(locality);
            const codeSlug = slugify(localityCode);
            if (!locality || !province || !localityCode || !localitySlug || !codeSlug) {
              throw new Error(`Invalid locality record ${i+1}.`);
            }
            return {
              locality,province,department,localityCode,localitySlug,
              folder:`${localitySlug}-${codeSlug}`,
              localityType:clean(r.localityType)||"No especificado",
              agglomeration:clean(r.agglomeration)||"No especificada",
              localGovernment:clean(r.localGovernment)||"No especificado",
              localGovernmentCategory:clean(r.localGovernmentCategory)||"No especificada",
              jurisdictionCode:clean(r.jurisdictionCode),
              departmentCode:clean(r.departmentCode),
              agglomerationCode:clean(r.agglomerationCode),
              localGovernmentCode:clean(r.localGovernmentCode)
            };
          }

          function makeTokens(item) {
            return {
              LOCALITY_NAME:escapeHtml(item.locality),
              LOCALITY_SLUG:item.localitySlug,
              LOCALITY_CODE:escapeHtml(item.localityCode),
              PROVINCE_NAME:escapeHtml(item.province),
              DEPARTMENT_NAME:escapeHtml(item.department||"No especificado"),
              LOCALITY_TYPE:escapeHtml(item.localityType),
              AGGLOMERATION_NAME:escapeHtml(item.agglomeration),
              LOCAL_GOVERNMENT_NAME:escapeHtml(item.localGovernment),
              LOCAL_GOVERNMENT_CATEGORY:escapeHtml(item.localGovernmentCategory),
              LOCALITY_FOLDER:item.folder,
              LOCALITY_CANONICAL_URL:`https://argentina.vidhwaan.com/${item.folder}/`,
              VILLAGE_NAME:escapeHtml(item.locality),
              VILLAGE_NAME_UPPER:escapeHtml(item.locality.toUpperCase()),
              PINCODE:escapeHtml(item.localityCode),
              VILLAGE_FOLDER:item.folder
            };
          }

          const items = localities.map(getItem);
          const folders = new Set();
          for (const item of items) {
            if (folders.has(item.folder)) throw new Error(`Duplicate locality folder: ${item.folder}`);
            folders.add(item.folder);
          }

          const localityManifest = {
            id:"./",
            name:"{{LOCALITY_NAME}} | Directorio de localidades de Argentina",
            short_name:"{{LOCALITY_NAME}}",
            description:"Información de directorio sobre {{LOCALITY_NAME}} en Argentina. Desarrollado por Vidhwaan, Village Based Global Technology Company.",
            lang:"es-AR",
            start_url:"./",
            scope:"./",
            display:"standalone",
            orientation:"portrait",
            background_color:"#ffffff",
            theme_color:"#ffffff",
            categories:["education","utilities"],
            icons:[
              {src:"../icons/icon-192.png",sizes:"192x192",type:"image/png",purpose:"any"},
              {src:"../icons/icon-512.png",sizes:"512x512",type:"image/png",purpose:"any"}
            ]
          };

          // Remove only old generated locality directories.
          let removed = 0;
          for (const name of fs.readdirSync(root)) {
            if (folders.has(name)) continue;
            const full = path.join(root,name);
            let stat;
            try { stat = fs.lstatSync(full); } catch { continue; }
            if (!stat.isDirectory()) continue;
            const indexPath = path.join(full,"index.html");
            const manifestPath = path.join(full,"manifest.json");
            const swPath = path.join(full,"sw.js");
            if (!fs.existsSync(indexPath) || !fs.existsSync(manifestPath) || !fs.existsSync(swPath)) continue;
            const html = fs.readFileSync(indexPath,"utf8");
            if (html.includes("https://argentina.vidhwaan.com/") || html.includes("{{LOCALITY_NAME}}")) {
              fs.rmSync(full,{recursive:true,force:true});
              removed++;
            }
          }
          console.log(`Removed ${removed} obsolete generated locality folders.`);

          for (let i = 0; i < items.length; i++) {
            const item = items[i];
            const directory = path.join(root,item.folder);
            const tokens = makeTokens(item);
            fs.mkdirSync(directory,{recursive:true});

            const html = replaceTokens(template,tokens);
            const manifestText = JSON.stringify(
              JSON.parse(replaceTokens(JSON.stringify(localityManifest),tokens))
            );
            const sw = replaceTokens(swTemplate,tokens);

            for (const [name,content] of Object.entries({
              "index.html":html,
              "manifest.json":manifestText,
              "sw.js":sw,
              "apps.json":appsJson
            })) {
              if (content.includes("{{")) throw new Error(`Unreplaced placeholder in ${item.folder}/${name}`);
              fs.writeFileSync(path.join(directory,name),content,"utf8");
            }

            if ((i+1)%500===0) console.log(`Generated ${i+1} of ${items.length} locality pages.`);
          }

          // The root manifest is for the homepage, not a locality page.
          const rootManifest = {
            id:"/",
            name:"Vidhwaan Argentina Locality Directory",
            short_name:"Vidhwaan Argentina",
            description:"Search Argentina localities, government portals and services. Vidhwaan Village Based Global Technology Company.",
            lang:"es-AR",
            start_url:"/",
            scope:"/",
            display:"standalone",
            orientation:"portrait",
            background_color:"#ffffff",
            theme_color:"#ffffff",
            icons:[
              {src:"/icons/icon-192.png",sizes:"192x192",type:"image/png",purpose:"any"},
              {src:"/icons/icon-512.png",sizes:"512x512",type:"image/png",purpose:"any"}
            ]
          };
          fs.writeFileSync("manifest.json",JSON.stringify(rootManifest),"utf8");
          console.log(`Successfully generated ${items.length} locality pages and the root manifest.`);

      - name: Verify Generated Pages and Manifests
        shell: node {0}
        run: |
          const fs = require("fs");
          const path = require("path");
          const localities = JSON.parse(fs.readFileSync("argentina.json","utf8"));
          const rootManifest = JSON.parse(fs.readFileSync("manifest.json","utf8"));
          if (rootManifest.start_url !== "/" || rootManifest.scope !== "/") {
            throw new Error("Root manifest has incorrect start_url or scope.");
          }
          for (const icon of rootManifest.icons) {
            if (!icon.src.startsWith("/icons/")) throw new Error(`Invalid root icon path: ${icon.src}`);
            if (!fs.existsSync(icon.src.slice(1))) throw new Error(`Missing root icon: ${icon.src}`);
          }

          function slugify(v) {
            return String(v).trim().normalize("NFD")
              .replace(/[\u0300-\u036f]/g,"").toLowerCase()
              .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
          }

          const required = ["index.html","manifest.json","sw.js","apps.json"];
          for (let i=0;i<localities.length;i++) {
            const r = localities[i];
            const folder = `${slugify(r.locality)}-${slugify(r.localityCode)}`;
            const dir = path.join(process.cwd(),folder);
            for (const f of required) {
              if (!fs.existsSync(path.join(dir,f))) throw new Error(`Missing ${folder}/${f}`);
            }
            const html = fs.readFileSync(path.join(dir,"index.html"),"utf8");
            const sw = fs.readFileSync(path.join(dir,"sw.js"),"utf8");
            const manifest = JSON.parse(fs.readFileSync(path.join(dir,"manifest.json"),"utf8"));
            const copiedApps = fs.readFileSync(path.join(dir,"apps.json"),"utf8");
            if (html.includes("{{")) throw new Error(`Unreplaced HTML placeholder in ${folder}`);
            if (sw.includes("{{")) throw new Error(`Unreplaced service-worker placeholder in ${folder}`);
            if (JSON.stringify(manifest).includes("{{")) throw new Error(`Unreplaced manifest placeholder in ${folder}`);
            if (copiedApps !== fs.readFileSync("apps.json","utf8")) throw new Error(`apps.json mismatch in ${folder}`);
            if (manifest.start_url !== "./" || manifest.scope !== "./") throw new Error(`Invalid locality manifest in ${folder}`);
          }
          console.log(`SUCCESS: Verified ${localities.length} locality pages and root manifest.`);

      - name: Commit Generated Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate Argentina locality pages and manifests"
            git push
          fi